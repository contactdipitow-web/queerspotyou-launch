name: Lock dependencies

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/lock-dependencies.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock Expo iOS dependencies"
          git push origin HEAD:main
